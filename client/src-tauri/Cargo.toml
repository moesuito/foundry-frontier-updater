[package]
name = "foundry_frontier_sync"
version = "1.1.0"
description = "Atualizador oficial de modpacks Foundry & Frontier"
authors = ["you"]
edition = "2021"

# Main Tauri app binary
[[bin]]
name = "foundry_frontier_sync"
path = "src/main.rs"

# Standalone sync runner helper — runs without Tauri, no windows_subsystem override
[[bin]]
name = "sync-runner"
path = "src/bin/sync-runner.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }
winresource = "0.1"

[dependencies]
tauri = { version = "1", features = ["shell-open", "dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
zip = "2.1"
directories = "5.0"
open = "3.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
